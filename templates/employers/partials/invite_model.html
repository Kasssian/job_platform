<div class="modal fade" id="inviteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Пригласить на вакансию</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="modal-body">
                    <p class="text-center mb-4">
                        <strong>{{ invite_target.user.get_full_name|default:invite_target.user.username }}</strong><br>
                        <small class="text-muted">{{ invite_target.desired_position }}</small>
                    </p>
                    <div class="mb-3">
                        <label class="form-label">Выберите вакансию:</label>
                        <select name="vacancy" class="form-select" required>
                            {% for vac in active_vacancies %}
                            <option value="{{ vac.id }}">{{ vac.title }} — {{ vac.location }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-success">Отправить приглашение</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    var modal = new bootstrap.Modal(document.getElementById('inviteModal'));
    modal.show();
</script>
